<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPROUT · Admin console</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
:root { --core: #001e41; --theme: #0074b7; --two: #5aaee0; --priv: #c98a1b; --done: #0a7d4f; --small: #c3ccd8; --side: 232px; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; } body { color: var(--ink); font-size: 14.5px; line-height: 1.5; }
h1, h2, h3 { margin: 0; color: var(--ink); } p { margin: 0; } button, input, select, textarea { font: inherit; }
/* shell */
.sb { position: fixed; inset: 0 auto 0 0; width: var(--side); background: #001e41; color: #cfe0f2; display: flex; flex-direction: column; gap: 2px; padding: 18px 12px; z-index: 30; overflow-y: auto; }
.sb .brand { padding: 4px 10px 20px; }
.sb .grp { font-size: .66rem; text-transform: uppercase; letter-spacing: .1em; color: #6f89a8; padding: 16px 10px 4px; font-weight: 700; }
.sb a:not(.lk) { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 6px; color: #cfe0f2; text-decoration: none; font-size: .9rem; }
.sb a:not(.lk):hover { background: rgba(255,255,255,.06); } .sb a.on { background: #fff; color: #001e41; font-weight: 600; }
.sb a .dot { width: 8px; height: 8px; border-radius: 50%; background: #3f5f84; flex: none; margin-left: auto; } .sb a .dot.busy { background: #e5b25b; box-shadow: 0 0 0 3px rgba(229,178,91,.25); }
.sb .foot { margin-top: auto; padding: 14px 10px 0; font-size: .74rem; color: #7f98b5; display: grid; gap: 8px; } .sb .foot a { padding: 0 !important; color: #9fc1e6 !important; font-size: .8rem !important; }
.sb .who { display: flex; gap: 8px; align-items: center; } .sb .who i { width: 28px; height: 28px; border-radius: 50%; background: #0074b7; color: #fff; display: grid; place-items: center; font-style: normal; font-weight: 700; font-size: .7rem; } .sb .who b { display: block; color: #fff; font-size: .8rem; }
.main { margin-left: var(--side); min-height: 100%; }
.top { position: sticky; top: 0; z-index: 20; background: var(--card); border-bottom: 1px solid var(--line); }
.top .in { padding: 11px 28px; display: flex; gap: 14px; align-items: center; justify-content: space-between; }
.crumb { font-size: .86rem; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .crumb b { color: var(--ink); }
.tchips { display: flex; gap: 8px; flex: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: .75rem; padding: 4px 10px; border-radius: 999px; background: var(--hover); color: var(--sub); white-space: nowrap; } .chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
.page { padding: 26px 28px 80px; display: grid; gap: 20px; max-width: 1240px; }
@media (max-width: 860px) { .sb { position: static; width: auto; flex-direction: row; flex-wrap: wrap; padding: 12px; gap: 4px; } .sb .brand { width: 100%; padding: 2px 6px 8px; } .sb .grp, .sb .foot, .sb a .dot { display: none; } .sb a:not(.lk) { padding: 6px 10px; font-size: .84rem; } .main { margin-left: 0; } .top .in { padding: 10px 16px; } .page { padding: 18px 16px 70px; } .crumb { display: none; } .tchips { flex-wrap: wrap; flex: 1; } }
/* primitives */
.ph { display: grid; gap: 6px; } .ph h1 { font-size: 1.6rem; letter-spacing: -.02em; } .ph p { color: var(--sub); max-width: 72ch; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; display: grid; gap: 14px; box-shadow: var(--shadow); min-width: 0; align-content: start; }
.card h2 { font-size: 1.05rem; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.sub { color: var(--sub); } .faint { color: var(--faint); } .small { font-size: .8rem; } .up { color: var(--green); } .down { color: var(--red); }
.kick { font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; color: var(--accent); }
.g2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; } .g3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 1080px) { .g2, .g3 { grid-template-columns: minmax(0, 1fr); } }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 2px; } .kpi span { font-size: .74rem; color: var(--sub); } .kpi b { font-family: var(--h); font-size: 1.5rem; letter-spacing: -.02em; line-height: 1.2; } .kpi small { font-size: .72rem; color: var(--faint); }
.kpis.flat .kpi { background: var(--hover); border: 0; } .kpis.flat .kpi b { font-size: 1.3rem; }
.btn { border: 0; border-radius: 6px; padding: 10px 16px; font-weight: 700; cursor: pointer; background: var(--navy); color: #fff; white-space: nowrap; font-size: .88rem; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn.blue { background: var(--accent); } .btn.green { background: var(--green); } .btn.ghost { background: transparent; border: 1.5px solid var(--line); color: var(--ink); } .btn.red { background: transparent; border: 1.5px solid var(--red); color: var(--red); } .btn.sm { padding: 6px 11px; font-size: .8rem; } .btn:disabled { opacity: .4; cursor: not-allowed; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: .74rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; } .pill i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.live { background: var(--green-soft); color: var(--green); } .pill.draft { background: var(--hover); color: var(--sub); } .pill.review { background: var(--amber-soft); color: var(--amber); } .pill.ready { background: var(--accent-soft); color: var(--accent); } .pill.pub { background: #e8e3f8; color: #5b3fb5; }
table.t { width: 100%; border-collapse: collapse; font-size: .84rem; } table.t th { text-align: left; font-size: .68rem; color: var(--faint); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; } table.t tr.click { cursor: pointer; } table.t tr.click:hover td { background: var(--hover); } td.r, th.r { text-align: right; } tr.me td { background: #fff0f5; }
.mk { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; font-weight: 700; font-size: .56rem; position: relative; overflow: hidden; flex: none; background: var(--navy); color: #fff; vertical-align: middle; }
.mk img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #fff; } .mk img.fb { object-fit: contain; padding: 14%; }
.stack { display: inline-flex; } .stack .mk { margin-left: -6px; box-shadow: 0 0 0 2px var(--card); } .stack .mk:first-child { margin-left: 0; }
.note { font-size: .84rem; padding: 11px 14px; border-radius: 8px; background: var(--hover); } .note.ok { background: var(--green-soft); color: var(--ink); } .note.warn { background: var(--amber-soft); }
.empty { padding: 22px; text-align: center; color: var(--sub); }
.kv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 14px; font-size: .86rem; margin: 0; } .kv dt { color: var(--sub); } .kv dd { margin: 0; text-align: right; font-weight: 600; }
.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--navy); color: #fff; padding: 11px 18px; border-radius: 8px; z-index: 70; font-size: .88rem; box-shadow: 0 12px 30px -10px rgba(0,0,0,.4); }
.prog { height: 8px; border-radius: 4px; background: var(--hover); overflow: hidden; } .prog span { display: block; height: 100%; background: var(--accent); transition: width .15s; } .prog.g span { background: var(--done); }
/* overview */
.sc { display: grid; gap: 14px; align-content: start; }
.sc .nm { font-size: 1.15rem; font-weight: 700; letter-spacing: -.01em; } .sc .meta { font-size: .8rem; color: var(--sub); }
.sc .nums { display: flex; gap: 18px; font-size: .8rem; color: var(--sub); } .sc .nums b { display: block; font-size: 1.1rem; color: var(--ink); font-family: var(--h); }
.sc .chg { font-size: .84rem; padding: 9px 12px; border-radius: 8px; background: var(--amber-soft); } .sc .chg b { display: block; }
.mix { display: flex; height: 10px; border-radius: 5px; overflow: hidden; gap: 1px; background: var(--line); } .mix span { display: block; }
.how { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.how div { background: var(--card); padding: 16px 18px; display: grid; gap: 4px; align-content: start; } .how b { font-size: .92rem; } .how p { font-size: .8rem; color: var(--sub); }
.how .n { width: 24px; height: 24px; border-radius: 50%; background: var(--navy); color: #fff; display: grid; place-items: center; font-size: .72rem; font-weight: 800; margin-bottom: 4px; }
@media (max-width: 900px) { .how { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.dr { display: grid; grid-template-columns: minmax(130px, 1fr) minmax(0, 2.4fr) auto; gap: 16px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); } .dr:last-child { border-bottom: 0; }
.dr .lab { font-size: .78rem; color: var(--sub); margin-top: 5px; } @media (max-width: 700px) { .dr { grid-template-columns: minmax(0, 1fr); gap: 8px; } }
/* strategy journey */
.rail { display: flex; gap: 6px; flex-wrap: wrap; } .rail span { display: inline-flex; align-items: center; gap: 7px; font-size: .78rem; font-weight: 600; color: var(--faint); padding: 5px 11px 5px 6px; border-radius: 999px; background: var(--hover); }
.rail span i { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: .68rem; background: var(--line); color: var(--sub); }
.rail span.done { color: var(--green); } .rail span.done i { background: var(--green); color: #fff; } .rail span.now { color: var(--ink); background: var(--accent-soft); } .rail span.now i { background: var(--navy); color: #fff; }
.stp { background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); min-width: 0; }
.stp > header { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 16px 20px; }
.stp .n { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: .85rem; background: var(--hover); color: var(--faint); }
.stp.now .n { background: var(--navy); color: #fff; } .stp.done .n { background: var(--green); color: #fff; }
.stp header h2 { font-size: 1.05rem; } .stp header p { font-size: .82rem; color: var(--sub); }
.stp .rs { font-size: .8rem; color: var(--sub); text-align: right; display: flex; gap: 10px; align-items: center; justify-content: flex-end; }
.stp.todo header { opacity: .55; } .stp.now { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow); }
.stp .bd { padding: 4px 20px 22px 68px; display: grid; gap: 18px; } @media (max-width: 760px) { .stp .bd { padding: 4px 16px 18px; } .stp > header { grid-template-columns: 32px minmax(0, 1fr); } .stp .rs { grid-column: 1 / -1; justify-content: flex-start; text-align: left; } }
.tog { border: 0; background: none; color: var(--accent); font-weight: 600; font-size: .8rem; cursor: pointer; padding: 0; }
.panel { border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.panel h3 { font-size: .95rem; }
.acts { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: flex-end; padding-top: 4px; border-top: 1px solid var(--line); } .acts .faint { margin-right: auto; font-size: .8rem; }
/* weights editor */
.wrow { display: grid; grid-template-columns: 26px minmax(0, 1.4fr) 58px minmax(70px, 2fr) 62px 22px; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); }
.wrow .nm b { display: block; font-size: .86rem; } .wrow .nm small { color: var(--faint); font-size: .72rem; } .wrow.new { background: linear-gradient(90deg, var(--green-soft), transparent); } .wrow.out { opacity: .5; }
.dlt { font-size: .7rem; font-weight: 700; text-align: center; border-radius: 4px; padding: 2px 4px; } .dlt.p { background: var(--green-soft); color: var(--green); } .dlt.m { background: var(--red-soft); color: var(--red); } .dlt.z { color: var(--faint); }
input[type=range] { width: 100%; accent-color: var(--accent); }
.wnum { width: 62px; border: 1px solid var(--line); border-radius: 5px; padding: 4px 6px; text-align: right; background: var(--card); color: var(--ink); }
.x { border: 0; background: none; color: var(--faint); cursor: pointer; } .x:hover { color: var(--red); }
.addrow { display: flex; gap: 8px; } .addrow select, .filters select, .filters input { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: var(--card); color: var(--ink); min-width: 0; } .addrow select { flex: 1; }
.total { display: flex; justify-content: space-between; align-items: center; padding: 9px 12px; border-radius: 6px; font-size: .84rem; } .total.ok { background: var(--green-soft); color: var(--green); } .total.bad { background: var(--amber-soft); color: var(--amber); }
.sbar { display: grid; gap: 4px; } .sbar .lab { display: flex; justify-content: space-between; font-size: .74rem; color: var(--sub); }
.sbar .bar { display: flex; height: 28px; border-radius: 5px; overflow: hidden; gap: 1px; } .sbar .bar span { display: grid; place-items: center; font-size: .64rem; color: #fff; font-weight: 700; overflow: hidden; white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; } .chips span { font-size: .76rem; font-weight: 600; padding: 3px 8px; border-radius: 4px; } .chips .p { background: var(--green-soft); color: var(--green); } .chips .m { background: var(--red-soft); color: var(--red); }
.headline { font-family: var(--h); font-size: 1.2rem; font-weight: 700; letter-spacing: -.02em; }
textarea { width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 9px 11px; min-height: 64px; resize: vertical; background: var(--card); color: var(--ink); font-size: .86rem; }
.rules { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .78rem; } .rules div { display: flex; gap: 6px; align-items: center; } .rules i { width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: .62rem; background: var(--hover); color: var(--faint); flex: none; } .rules .ok i { background: var(--green); color: #fff; } .rules .no i { background: var(--amber); color: #fff; }
/* applied to every portfolio */
.lvr { display: grid; grid-template-columns: 150px minmax(0, 1fr) minmax(0, 1.3fr); gap: 14px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: .82rem; } .lvr:last-child { border-bottom: 0; }
.lvr b { display: block; font-size: .86rem; } .lvr small { color: var(--faint); font-size: .74rem; } .lvr .mixl { font-size: .7rem; color: var(--sub); margin-top: 3px; }
@media (max-width: 760px) { .lvr { grid-template-columns: minmax(0, 1fr); gap: 6px; } }
.chc { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 16px; } .chc div { display: grid; grid-template-columns: 12px minmax(0, 1fr); gap: 8px; font-size: .82rem; } .chc i { width: 12px; height: 12px; border-radius: 3px; margin-top: 3px; } .chc small { display: block; color: var(--faint); font-size: .74rem; } @media (max-width: 700px) { .chc { grid-template-columns: minmax(0, 1fr); } }
.lgd { display: flex; gap: 14px; flex-wrap: wrap; font-size: .74rem; color: var(--sub); } .lgd i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.ex { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; } @media (max-width: 900px) { .ex { grid-template-columns: minmax(0, 1fr); } }
.ex .e { border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: grid; gap: 4px; font-size: .8rem; align-content: start; } .ex .e.lv { border-color: #ff4f8b; } .ex .tag { font-size: .64rem; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; color: #d6336c; }
/* checks + approval */
.chk { display: grid; } .chk div { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: .84rem; } .chk div:last-child { border-bottom: 0; }
.chk i { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: .66rem; color: #fff; background: var(--green); } .chk .no i { background: var(--red); } .chk .na i { background: var(--faint); } .chk small { color: var(--faint); display: block; font-size: .72rem; }
.lvls { display: flex; gap: 6px; flex-wrap: wrap; } .lvls span { font-size: .76rem; font-weight: 600; padding: 5px 10px; border-radius: 6px; background: var(--hover); color: var(--faint); } .lvls span.ok { background: var(--green-soft); color: var(--green); } .lvls span.no { background: var(--red-soft); color: var(--red); }
.signer { display: flex; gap: 12px; align-items: center; } .signer i { width: 36px; height: 36px; border-radius: 50%; background: var(--amber); color: #fff; display: grid; place-items: center; font-style: normal; font-weight: 800; font-size: .78rem; flex: none; } .signer b { display: block; font-size: .9rem; } .signer small { color: var(--sub); font-size: .78rem; }
/* fan-out */
.fan svg { width: 100%; height: auto; display: block; }
.fan .lnk { fill: none; stroke: #bcd3ea; } .fan .lnk.flow { stroke: var(--accent); stroke-dasharray: 5 7; animation: dash .9s linear infinite; } @keyframes dash { to { stroke-dashoffset: -24; } }
.fan rect.q { transition: fill 250ms ease, opacity 250ms ease; } .fan rect.q.pend { opacity: .35; } .fan rect.q.done { fill: var(--done) !important; opacity: 1; } .fan rect.q.small { fill: var(--small) !important; opacity: 1; } .fan rect.q.live { stroke: #ff4f8b; stroke-width: 1.6; }
.runst { display: flex; gap: 22px; flex-wrap: wrap; font-size: .82rem; color: var(--sub); } .runst b { font-family: var(--h); font-size: 1.15rem; color: var(--ink); display: block; }
.exec { font-family: ui-monospace, Menlo, monospace; font-size: .74rem; background: #0b1726; color: #b9cde4; border-radius: 8px; padding: 12px 14px; max-height: 240px; overflow: auto; display: grid; gap: 2px; margin-top: 8px; } .exec .ok { color: #5fd49b; } .exec .dim { color: #6f89a8; }
details summary { cursor: pointer; font-size: .82rem; font-weight: 600; color: var(--accent); }
.fin { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 16px 18px; border-radius: 12px; background: var(--green-soft); } .fin i { width: 40px; height: 40px; border-radius: 50%; background: var(--green); color: #fff; display: grid; place-items: center; font-style: normal; font-weight: 800; } .fin b { font-size: 1rem; } .fin small { display: block; color: var(--sub); font-size: .82rem; }
@media (max-width: 700px) { .fin { grid-template-columns: 40px minmax(0, 1fr); } .fin .btn { grid-column: 1 / -1; } }
/* records */
.log { display: grid; font-size: .82rem; } .log div { display: grid; grid-template-columns: 110px 96px minmax(0, 1fr); gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); } .log code { font-family: ui-monospace, Menlo, monospace; font-size: .72rem; color: var(--sub); }
@media (max-width: 700px) { .log div { grid-template-columns: minmax(0, 1fr); gap: 2px; } }
.tagx { font-size: .64rem; font-weight: 800; padding: 2px 6px; border-radius: 3px; justify-self: start; } .tagx.s { background: var(--navy); color: #fff; } .tagx.r { background: var(--amber-soft); color: var(--amber); } .tagx.g { background: var(--green-soft); color: var(--green); } .tagx.i { background: var(--accent-soft); color: var(--accent); }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; } .pager { display: flex; gap: 8px; align-items: center; justify-content: flex-end; font-size: .8rem; }
.ov { position: fixed; inset: 0; background: rgba(0,20,45,.25); z-index: 60; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100%); background: var(--card); z-index: 61; box-shadow: -20px 0 60px -20px rgba(0,0,0,.4); padding: 22px; overflow: auto; display: grid; gap: 14px; align-content: start; }
@media (max-width: 700px) { .card { overflow-x: auto; } }
/* guided tour: a coach card bottom-left and a soft ring on the part of the page it describes (as in SCALE) */
.tourbtn { display: inline-flex; align-items: center; gap: 7px; padding: 4px 12px; border: 1.5px solid var(--navy); border-radius: 999px; background: var(--card); font: inherit; font-size: .76rem; font-weight: 700; color: var(--navy); cursor: pointer; white-space: nowrap; }
.tourbtn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linejoin: round; } .tourbtn:hover { background: var(--navy); color: #fff; } body.touring .tourbtn { display: none; }

    if (T.tour == null) TP = tourPid();
    // Only moving forward does the real step; Back just revisits, so it never re-runs a publish or a rebalance.
    var fwd = T.tour == null || i > T.tour;
    T.tour = i; T.tourErr = null; T.drawer = null; var t = TOUR[i];
    if (t.open != null) T.expand[TP + t.open] = true;
    T.tourBusy = true; tourCoach(true);
    return Promise.resolve().then(function () { return fwd && t.prep && t.prep(); }).catch(function (er) { T.tourErr = er && er.message ? er.message : "That step didn't complete."; }).then(function () {
      T.tourBusy = false; if (T.tour !== i) return;
      var want = "#/" + (t.page === "strategy" ? "strategy/" + TP : t.page);
      if (location.hash !== want) location.hash = want; else render();
      tourCoach(); tourMark(true);
    });
  }
  function tourNext() { if (T.tour != null) tourGo(T.tour + 1); }
  function tourEnd() {
    if (T.tour == null) return;
    var done = T.tour === TOUR.length - 1;
    T.tour = null; T.tourBusy = false; T.tourErr = null; document.querySelectorAll(".tour-on").forEach(function (x) { x.classList.remove("tour-on"); }); tourCoach();
    // Drop ?tour=1 so a reload doesn't start the tour again.
    toast(done ? "Tour complete. Take it again any time from the top bar." : "Tour closed. Restart it any time from Take the tour.");
    if (/[?&]tour=1/.test(location.search)) history.replaceState(null, "", location.pathname + location.search.replace(/([?&])tour=1(&|$)/, function (m, a, b) { return b ? a : ""; }) + location.hash);
  }

  document.addEventListener("click", function (e) {
    var t = e.target;
    var tb = t.closest("[data-tour]"); if (tb) { var k = tb.dataset.tour; return k === "start" ? tourGo(0) : k === "next" ? tourNext() : k === "back" ? tourGo(T.tour - 1) : tourEnd(); }
    var tg = t.closest("[data-tog]"); if (tg) { T.expand[tg.dataset.tog] = !T.expand[tg.dataset.tog]; return render(); }
    var iv = t.closest("[data-inv]"); if (iv && T.invRows) { T.drawer = T.invRows[+iv.dataset.inv]; return renderLayer(); }
    var rm = t.closest("[data-rm]"); if (rm) { setW(route().id, rm.dataset.rm, 0); return render(); }
    var b = t.closest("[data-a]"); if (!b || b.disabled) return;
    var a = b.dataset.a, pid = b.dataset.p || route().id;
    if (a === "close") { T.drawer = null; return renderLayer(); }
    if (T.run && ["run", "rundrift", "publish"].indexOf(a) >= 0) return toast("A rebalance is already running");
    if (a === "loadprop") { draft(pid).w = copy(STRATS[pid].prop); if (!draft(pid).why) draft(pid).why = STRATS[pid].why; invalidate(pid); C.status[pid] = "draft"; log("Schroders", STRATS[pid].short + ": loaded the team's proposal (" + summary(pid).head + ")"); save(); return render(); }
    if (a === "resetw") { delete C.drafts[pid]; delete C.status[pid]; invalidate(pid); save(); return render(); }
    if (a === "add") { var sel = $("addsel"); if (sel && sel.value) { setW(pid, sel.value, 2); render(); } return; }
    if (a === "norm") { var w = draft(pid).w, tot = Object.values(w).reduce(function (x, y) { return x + y; }, 0); if (!tot) return; Object.keys(w).forEach(function (k) { w[k] = Math.round(w[k] / tot * 100 * 2) / 2; }); var diff = Math.round((100 - Object.values(w).reduce(function (x, y) { return x + y; }, 0)) * 2) / 2, top = Object.keys(w).sort(function (x, y) { return w[y] - w[x]; })[0]; w[top] += diff; invalidate(pid); save(); return render(); }
    if (a === "tostep2") return scrollToStep(2);
    if (a === "check") return check(pid);
    if (a === "submit") { submit(pid); toast("Sent to the risk officer"); render(); return scrollToStep(2); }
    if (a === "approve") { approve(pid); toast("Approved. Ready to publish."); render(); return scrollToStep(3); }
    if (a === "reject") { C.status[pid] = "draft"; invalidate(pid); C.review[pid] = { note: "Please review sizing of the new position against the mandate before resubmitting." }; log("Risk", STRATS[pid].short + ": sent back for changes"); save(); toast("Sent back to the portfolio manager"); render(); return scrollToStep(1); }
    if (a === "withdraw") { C.status[pid] = "draft"; invalidate(pid); delete C.review[pid]; log("Schroders", STRATS[pid].short + ": change withdrawn for editing"); save(); return render(); }
    if (a === "publish") return publish(pid);
    if (a === "run") return runRebal(pid);
    if (a === "rundrift") return runDrift(pid);
    if (a === "newchange") { delete T.done[pid]; T.sq[pid] = {}; return render(); }
    if (a === "pg-" || a === "pg+") { T.inv.page = Math.max(0, T.inv.page + (a === "pg+" ? 1 : -1)); return render(); }
    if (a === "export") { var csv = "time,actor,action,glider_call\n" + C.log.map(function (l) { return [new Date(l.at).toISOString(), l.who, '"' + l.what.replace(/"/g, '""') + '"', '"' + (l.call || "") + '"'].join(","); }).join("\n"); var u = URL.createObjectURL(new Blob([csv], { type: "text/csv" })), ln = document.createElement("a"); ln.href = u; ln.download = "sprout-activity.csv"; ln.click(); setTimeout(function () { URL.revokeObjectURL(u); }, 1000); }
  });
  document.addEventListener("input", function (e) {
    var t = e.target, pid = route().id;
    if (t.dataset.w) { setW(pid, t.dataset.w, +t.value); var n = document.querySelector('[data-wn="' + t.dataset.w + '"]'); if (n) n.value = t.value; paintEdit(pid); }
    if (t.id === "why") { draft(pid).why = t.value; save(); }
    if (t.id === "fq") { T.inv.q = t.value; T.inv.page = 0; clearTimeout(T.qt); T.qt = setTimeout(function () { render(); var f = $("fq"); if (f) { f.focus(); f.setSelectionRange(f.value.length, f.value.length); } }, 250); }
  });
  document.addEventListener("change", function (e) {
    var t = e.target, pid = route().id;
    if (t.dataset.w) render();
    if (t.dataset.wn) { setW(pid, t.dataset.wn, +t.value); render(); }
    if (t.id === "fp" || t.id === "fl" || t.id === "fk") { T.inv[{ fp: "pid", fl: "lv", fk: "kind" }[t.id]] = t.value; T.inv.page = 0; render(); }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && T.drawer) { T.drawer = null; return renderLayer(); }
    if (T.tour == null || /input|select|textarea/i.test(e.target.tagName)) return;
    if (e.key === "Escape") tourEnd(); else if (e.key === "ArrowRight") tourNext(); else if (e.key === "ArrowLeft") tourGo(T.tour - 1);
  });
  window.addEventListener("hashchange", function () { T.drawer = null; var go = function () { render(); window.scrollTo(0, 0); }; if (document.startViewTransition && !reduce && !T.run && T.tour == null) { var vt = document.startViewTransition(go); vt.ready.catch(function () {}); vt.finished.catch(function () {}); vt.updateCallbackDone.catch(function () {}); } else go(); });
  window.addEventListener("storage", function (e) { if (e.key === APPKEY && !T.run) render(); });

  fetch("/api/assets").then(function (r) { return r.json(); }).then(function (l) { T.assets = {}; l.forEach(function (a) { if (a.chain_id === 56 && a.usable) T.assets[a.symbol] = a.caip_id; }); if (!T.run) render(); }).catch(function () {});
  fetch("/api/validation").then(function (r) { return r.json(); }).then(function (v) { if (v.total) T.valid = v; }).catch(function () {});
  fetch("/api/glider/live").then(function (r) { return r.json(); }).then(function (d) { T.gl = d; $("gl").innerHTML = '<i style="background:' + (d.connected ? "var(--green)" : "var(--red)") + '"></i>Glider · ' + (d.connected ? "connected" : "unavailable"); }).catch(function () { $("gl").innerHTML = '<i style="background:var(--red)"></i>Glider · unavailable'; });
  loadPx(); setInterval(loadPx, 60000); tick(); setInterval(tick, 1000);
  render();
  if (/[?&]tour=1/.test(location.search)) setTimeout(function () { tourGo(0); }, 400);
})();
</script>
