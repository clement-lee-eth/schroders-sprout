<style>
/* App shell. Onboarding: split screen (brand panel + flow). Signed in: sidebar on desktop, bottom tab bar on mobile.
   Navy = Schroders, green = Glider / gains / on target, amber = off target. */
:root {
  --bg: #f5f8f6; --card: #ffffff; --ink: #0c1712; --sub: #5c6a63; --faint: #8b9891; --line: #e3eae5; --hover: #f0f4f1;
  --navy: #1f2f6b; --navy-soft: #e9ecf7; --green: #12824f; --green-soft: #e3f4ea; --amber: #b47a12; --amber-soft: #f8f0dd; --red: #b2382c; --red-soft: #f8e4e1;
  --stage: #0d1813; --stage-ink: #e8efeb; --stage-sub: #8fa197; --stage-line: #22322a;
  --shadow: 0 1px 2px rgba(10,30,20,.04), 0 10px 30px -14px rgba(10,30,20,.14);
  --f: "Geist", "Helvetica Neue", Arial, sans-serif; --m: "Geist Mono", ui-monospace, Menlo, monospace;
  --tabbar: 64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b110e; --card: #111a15; --ink: #e8efeb; --sub: #9aa9a1; --faint: #6d7b74; --line: #1f2b25; --hover: #16211b;
    --navy: #a3b4f2; --navy-soft: #1b2445; --green: #5fd49b; --green-soft: #133222; --amber: #e5b25b; --amber-soft: #312715; --red: #f08b7f; --red-soft: #3a201c;
    --stage: #070d0a; --stage-line: #1b2821; --shadow: 0 1px 0 rgba(255,255,255,.03); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b110e; --card: #111a15; --ink: #e8efeb; --sub: #9aa9a1; --faint: #6d7b74; --line: #1f2b25; --hover: #16211b;
  --navy: #a3b4f2; --navy-soft: #1b2445; --green: #5fd49b; --green-soft: #133222; --amber: #e5b25b; --amber-soft: #312715; --red: #f08b7f; --red-soft: #3a201c;
  --stage: #070d0a; --stage-line: #1b2821; --shadow: 0 1px 0 rgba(255,255,255,.03); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
.mono, .num { font-family: var(--m); font-variant-numeric: tabular-nums; }
.sub { color: var(--sub); } .faint { color: var(--faint); } .up { color: var(--green); } .down { color: var(--red); }
#root { min-height: 100%; }

/* ---------- Onboarding (split) ---------- */
.ob { min-height: 100vh; min-height: 100dvh; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
@media (max-width: 900px) { .ob { grid-template-columns: minmax(0, 1fr); } }
.brand { background: var(--stage); color: var(--stage-ink); padding: calc(36px + env(safe-area-inset-top, 0px)) clamp(24px, 5vw, 64px) 36px; display: grid; align-content: space-between; gap: 32px; position: relative; overflow: hidden; }
.brand::before { content: ""; position: absolute; inset: auto -20% -30% 10%; height: 70%; background: radial-gradient(closest-side, rgba(79,111,214,.35), transparent), radial-gradient(closest-side at 70% 40%, rgba(18,130,79,.4), transparent); filter: blur(12px); }
.brand::after { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px); background-size: 22px 22px; mask-image: linear-gradient(180deg, transparent, #000 40%, transparent); -webkit-mask-image: linear-gradient(180deg, transparent, #000 40%, transparent); }
.brand > * { position: relative; z-index: 1; }
.brand h1 { font-size: clamp(2.2rem, 4.6vw, 3.6rem); font-weight: 600; letter-spacing: -.04em; line-height: 1.04; max-width: 14ch; }
.brand h1 em, .serif { font-family: "Newsreader", Georgia, serif; font-style: italic; font-weight: 400; }
.brand p { color: var(--stage-sub); max-width: 46ch; font-size: 1.02rem; }
.brand ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.brand li { display: flex; gap: 12px; align-items: center; color: var(--stage-ink); }
.brand li i { width: 28px; height: 28px; border-radius: 9px; background: rgba(255,255,255,.07); display: grid; place-items: center; font-style: normal; font-size: .8rem; color: #5fd49b; flex: none; }
.brand .by { display: flex; gap: 8px; flex-wrap: wrap; }
.brand .by span { font-size: .8rem; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--stage-line); background: rgba(255,255,255,.05); }
@media (max-width: 900px) { .brand { padding: calc(20px + env(safe-area-inset-top, 0px)) 20px 24px; gap: 16px; } .brand h1 { font-size: 1.9rem; } .brand ul, .brand .by.hide-m { display: none; } }
.flow { display: grid; place-items: center; padding: 32px 20px calc(32px + env(safe-area-inset-bottom, 0px)); position: relative; }
.flowcard { width: min(460px, 100%); display: grid; gap: 18px; }
.flowcard h2 { font-size: 1.6rem; font-weight: 600; letter-spacing: -.035em; line-height: 1.12; text-wrap: balance; }
.flowcard .stepline { display: flex; gap: 6px; }
.flowcard .stepline span { height: 4px; flex: 1; border-radius: 4px; background: var(--line); }
.flowcard .stepline span.on { background: var(--green); }
.lbl { font-size: .76rem; color: var(--faint); font-family: var(--m); }

/* ---------- Shell ---------- */
.shell { min-height: 100vh; min-height: 100dvh; display: grid; grid-template-columns: 248px minmax(0, 1fr); }
.side { position: sticky; top: 0; height: 100vh; height: 100dvh; border-right: 1px solid var(--line); background: var(--card); padding: 22px 14px; display: grid; grid-template-rows: auto 1fr auto; gap: 24px; }
.logo { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 1.15rem; letter-spacing: -.03em; padding: 0 8px; }
.logo i { width: 18px; height: 18px; border-radius: 50% 50% 50% 3px; background: var(--green); transform: rotate(-45deg); display: inline-block; }
.nav { display: grid; gap: 4px; align-content: start; }
.nav button { appearance: none; border: 0; background: transparent; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; cursor: pointer; color: var(--sub); font-weight: 500; text-align: left; }
.nav button:hover { background: var(--hover); color: var(--ink); }
.nav button[aria-current="page"] { background: var(--ink); color: var(--card); }
.nav svg { width: 20px; height: 20px; flex: none; }
.me { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 14px; background: var(--hover); font-size: .82rem; min-width: 0; }
.av { width: 34px; height: 34px; border-radius: 50%; background: var(--navy); color: #fff; display: grid; place-items: center; font-weight: 600; flex: none; }
.me div { min-width: 0; } .me b { display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .me span { color: var(--faint); font-family: var(--m); font-size: .72rem; }
.main { min-width: 0; display: grid; grid-template-rows: auto 1fr; }
.topbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: calc(14px + env(safe-area-inset-top, 0px)) 28px 14px;
  background: color-mix(in srgb, var(--bg) 82%, transparent); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent); }
.topbar h1 { font-size: 1.25rem; font-weight: 600; letter-spacing: -.03em; }
.topbar .right { display: flex; align-items: center; gap: 10px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: .76rem; padding: 6px 11px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); color: var(--sub); white-space: nowrap; }
.pill i { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.content { padding: 24px 28px calc(40px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 20px; align-content: start; max-width: 1080px; width: 100%; }
.tabbar { display: none; }
@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .topbar { padding: calc(12px + env(safe-area-inset-top, 0px)) 18px 12px; }
  .content { padding: 18px 16px calc(var(--tabbar) + 28px + env(safe-area-inset-bottom, 0px)); }
  .tabbar { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; height: calc(var(--tabbar) + env(safe-area-inset-bottom, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px);
    background: color-mix(in srgb, var(--card) 90%, transparent); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border-top: 1px solid var(--line); }
  .tabbar button { appearance: none; border: 0; background: none; display: grid; place-items: center; align-content: center; gap: 2px; font-size: .68rem; color: var(--faint); cursor: pointer; }
  .tabbar button[aria-current="page"] { color: var(--ink); }
  .tabbar svg { width: 22px; height: 22px; }
}

/* ---------- Components ---------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 20px; display: grid; gap: 14px; box-shadow: var(--shadow); min-width: 0; align-content: start; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 1100px) { .grid3 { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 1000px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.btn { appearance: none; border: 0; border-radius: 999px; padding: 13px 18px; font-weight: 500; cursor: pointer; background: var(--ink); color: var(--card); transition: transform 150ms ease; text-align: center; }
.btn.full { width: 100%; }
.btn.sm { padding: 8px 14px; font-size: .84rem; }
.btn.green { background: var(--green); color: #fff; }
.btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); }
.btn:not(:disabled):hover { transform: translateY(-1px); }
.btn:disabled { opacity: .4; cursor: default; }
:root[data-theme="dark"] .btn.green { color: #06110b; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.green { color: #06110b; } }
.back { appearance: none; border: 0; background: none; color: var(--sub); cursor: pointer; padding: 0; justify-self: start; font-size: .88rem; }
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: .72rem; font-weight: 500; padding: 3px 9px; border-radius: 999px; justify-self: start; white-space: nowrap; }
.tag i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.tag.navy { background: var(--navy-soft); color: var(--navy); } .tag.green { background: var(--green-soft); color: var(--green); } .tag.amber { background: var(--amber-soft); color: var(--amber); } .tag.grey { background: var(--hover); color: var(--sub); }
.field { display: grid; gap: 6px; }
.field label { font-size: .82rem; color: var(--sub); }
.field input, .field select { border: 1.5px solid var(--line); background: var(--card); border-radius: 14px; padding: 13px 14px; width: 100%; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: .9rem; cursor: pointer; }
.check input { margin-top: 3px; width: 18px; height: 18px; accent-color: var(--green); flex: none; }
.opts { display: grid; gap: 10px; }
.opt { appearance: none; text-align: left; border: 1.5px solid var(--line); background: var(--card); border-radius: 16px; padding: 14px 16px; cursor: pointer; font-weight: 500; }
.opt:hover { border-color: var(--faint); }
.opt[aria-pressed="true"] { border-color: var(--green); background: var(--green-soft); }
.note { font-size: .86rem; padding: 11px 13px; border-radius: 14px; }
.note.warn { background: var(--amber-soft); color: var(--amber); } .note.bad { background: var(--red-soft); color: var(--red); } .note.good { background: var(--green-soft); color: var(--green); } .note.soft { background: var(--hover); color: var(--sub); }
.kv { display: grid; gap: 10px; font-size: .9rem; margin: 0; }
.kv > div { display: flex; justify-content: space-between; gap: 12px; }
.kv dt { color: var(--sub); } .kv dd { margin: 0; text-align: right; font-family: var(--m); font-size: .84rem; }
.addr { font-family: var(--m); font-size: .78rem; padding: 9px 11px; border-radius: 12px; background: var(--hover); overflow-wrap: anywhere; }
.mix { display: flex; height: 8px; border-radius: 8px; overflow: hidden; gap: 2px; }
.mix span { height: 100%; border-radius: 2px; }
.hold { display: flex; flex-wrap: wrap; gap: 5px; }
.hold span { font-family: var(--m); font-size: .7rem; padding: 3px 7px; border-radius: 7px; background: var(--hover); }
.meter { height: 10px; border-radius: 10px; background: linear-gradient(90deg, var(--green), var(--amber), var(--red)); position: relative; }
.meter i { position: absolute; top: -5px; width: 4px; height: 20px; border-radius: 4px; background: var(--ink); transform: translateX(-2px); }
.big { font-size: clamp(2.2rem, 5vw, 3rem); font-weight: 500; letter-spacing: -.045em; line-height: 1; font-variant-numeric: tabular-nums; }
.drift { height: 8px; border-radius: 8px; background: var(--hover); overflow: hidden; }
.drift span { display: block; height: 100%; background: var(--amber); border-radius: 8px; transition: width 500ms ease; }
.list { display: grid; }
.li { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); }
.li:last-child { border-bottom: 0; }
.ic { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-family: var(--m); font-size: .58rem; background: var(--hover); border: 1px solid var(--line); flex: none; }
.ic.g { background: var(--green-soft); color: var(--green); border-color: transparent; font-size: .9rem; font-family: var(--f); }
.ic.n { background: var(--navy-soft); color: var(--navy); border-color: transparent; font-size: .9rem; font-family: var(--f); }
.ic.a { background: var(--amber-soft); color: var(--amber); border-color: transparent; font-size: .9rem; font-family: var(--f); }
.li b { font-weight: 500; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .li small { color: var(--faint); font-size: .76rem; }
.li .r { text-align: right; font-family: var(--m); font-size: .86rem; } .li .r small { display: block; font-family: var(--m); }
.alloc { display: grid; gap: 4px; min-width: 0; }
.alloc .bar { height: 6px; border-radius: 6px; background: var(--hover); position: relative; }
.alloc .bar span { position: absolute; inset: 0 auto 0 0; border-radius: 6px; background: var(--green); transition: width 600ms ease; }
.alloc .bar span.off { background: var(--amber); }
.alloc .bar em { position: absolute; top: -3px; bottom: -3px; width: 2px; border-radius: 2px; background: var(--navy); }
.pcard { cursor: pointer; transition: transform 180ms ease; text-align: left; appearance: none; font: inherit; color: inherit; }
.pcard:hover { transform: translateY(-2px); }
.chart { width: 100%; height: 170px; display: block; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.steps li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; color: var(--faint); font-size: .88rem; }
.steps li i { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-style: normal; font-size: .64rem; }
.steps li.on { color: var(--ink); } .steps li.on i { border-color: var(--green); }
.steps li.done { color: var(--ink); } .steps li.done i { background: var(--green); border-color: var(--green); color: #fff; }
.banner { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 16px 18px; border-radius: 20px; background: var(--navy-soft); color: var(--navy); }
.banner p { color: var(--navy); opacity: .85; font-size: .88rem; }
.banner b { font-weight: 600; }
@media (max-width: 600px) { .banner { grid-template-columns: 40px minmax(0, 1fr); } .banner .btn { grid-column: 1 / -1; } }
.daygroup { font-size: .76rem; color: var(--faint); font-family: var(--m); padding-top: 6px; }
details.trades summary { cursor: pointer; color: var(--sub); font-size: .82rem; list-style: none; }
details.trades summary::-webkit-details-marker { display: none; }
.tl { display: grid; gap: 4px; font-size: .82rem; padding-top: 8px; }
.tl div { display: grid; grid-template-columns: 3rem minmax(0, 1fr) auto; gap: 8px; }
.sell { color: var(--amber); } .buy { color: var(--green); }
.empty { text-align: center; color: var(--faint); padding: 24px; }

/* Sheet (invest flow inside the app) */
.sheet-back { position: fixed; inset: 0; z-index: 40; background: rgba(8,16,12,.45); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); display: grid; place-items: center; padding: 16px; }
.sheet { width: min(480px, 100%); max-height: calc(100dvh - 32px); overflow: auto; background: var(--bg); border-radius: 26px; padding: 22px; display: grid; gap: 16px; box-shadow: 0 40px 80px -30px rgba(0,0,0,.5); }
.sheet.anim { animation: rise 260ms cubic-bezier(.2,.8,.2,1); }
@media (max-width: 600px) { .sheet-back { place-items: end center; padding: 0; } .sheet { border-radius: 26px 26px 0 0; padding-bottom: calc(22px + env(safe-area-inset-bottom, 0px)); } }

/* Privy-style login modal */
.pm-back { position: fixed; inset: 0; background: rgba(8,16,12,.45); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); display: grid; place-items: center; z-index: 50; padding: 16px; }
.pm-back.anim { animation: fadein 200ms ease; }
@media (max-width: 600px) { .pm-back { place-items: end center; padding: 0; } }
.pm { width: min(400px, 100%); background: var(--card); border-radius: 24px; padding: 24px 22px 16px; display: grid; gap: 14px; box-shadow: 0 30px 60px -20px rgba(0,0,0,.45); position: relative; }
@media (max-width: 600px) { .pm { border-radius: 24px 24px 0 0; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); } }
.pm.anim { animation: rise 260ms cubic-bezier(.2,.8,.2,1); }
@keyframes rise { from { transform: translateY(18px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
.pm .x { position: absolute; top: 12px; right: 12px; appearance: none; border: 0; background: var(--hover); width: 30px; height: 30px; border-radius: 50%; cursor: pointer; color: var(--sub); }
.pm-logo { justify-self: center; display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 1.25rem; letter-spacing: -.03em; margin-top: 4px; }
.pm-logo i { width: 18px; height: 18px; border-radius: 50% 50% 50% 3px; background: var(--green); transform: rotate(-45deg); display: inline-block; }
.pm h3 { text-align: center; font-size: 1.05rem; font-weight: 600; }
.pm .lead { text-align: center; font-size: .86rem; color: var(--sub); }
.pm-email { display: flex; align-items: center; gap: 8px; border: 1.5px solid var(--line); border-radius: 14px; padding: 6px 6px 6px 12px; }
.pm-email:focus-within { border-color: var(--green); }
.pm-email input { flex: 1; border: 0; background: transparent; outline: none; padding: 8px 0; min-width: 0; }
.pm-email button { appearance: none; border: 0; border-radius: 10px; padding: 9px 14px; background: var(--green); color: #fff; font-weight: 500; cursor: pointer; }
.pm-or { display: flex; align-items: center; gap: 10px; color: var(--faint); font-size: .76rem; }
.pm-or::before, .pm-or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.pm-sso { appearance: none; display: flex; align-items: center; justify-content: center; gap: 10px; border: 1.5px solid var(--line); background: var(--card); border-radius: 14px; padding: 11px; cursor: pointer; font-weight: 500; }
.pm-sso b { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: .78rem; background: var(--hover); }
.pm-foot { text-align: center; font-size: .72rem; color: var(--faint); padding-top: 6px; border-top: 1px solid var(--line); }
.pm-foot b { color: var(--ink); letter-spacing: -.02em; }
.pm-env { justify-self: center; width: 52px; height: 52px; border-radius: 50%; background: var(--green-soft); color: var(--green); display: grid; place-items: center; font-size: 1.4rem; }
.code { display: flex; gap: 8px; }
.code input { width: 100%; text-align: center; font-family: var(--m); font-size: 1.2rem; border: 1.5px solid var(--line); border-radius: 12px; padding: 9px 0; background: var(--card); }
.code input.filled { border-color: var(--green); }
.spin { justify-self: center; width: 44px; height: 44px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--green); animation: rot 800ms linear infinite; }
@keyframes rot { to { transform: rotate(360deg); } }

/* Demo menu + toast */
.demo { position: relative; }
.demo-menu { position: absolute; right: 0; top: calc(100% + 8px); width: 280px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 8px; box-shadow: 0 20px 50px -20px rgba(0,0,0,.35); display: grid; gap: 2px; z-index: 30; }

.demo-menu button:hover { background: var(--hover); }

.demo-menu b { font-weight: 500; font-size: .9rem; } .demo-menu span { font-size: .76rem; color: var(--faint); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: var(--ink); color: var(--card); padding: 12px 18px; border-radius: 14px; font-size: .88rem; box-shadow: 0 20px 40px -20px rgba(0,0,0,.5); animation: rise 220ms ease; max-width: calc(100% - 32px); }
@media (max-width: 900px) { .toast { bottom: calc(var(--tabbar) + 16px + env(safe-area-inset-bottom, 0px)); } }
/* Chart interaction */
.chartwrap { position: relative; touch-action: pan-y; }
.chartwrap .cline { position: absolute; top: 0; bottom: 22px; width: 1px; background: var(--faint); pointer-events: none; }
.chartwrap .cdot { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: var(--card); border: 2.5px solid var(--green); transform: translate(-50%, -50%); pointer-events: none; }

.cdates { display: flex; justify-content: space-between; font-size: .72rem; color: var(--faint); font-family: var(--m); margin-top: 4px; }
/* Schroders' view */
.view { background: linear-gradient(135deg, var(--navy-soft), var(--card)); border-color: color-mix(in srgb, var(--navy) 18%, var(--line)); }
.view blockquote { margin: 0; font-family: "Newsreader", Georgia, serif; font-style: italic; font-size: 1.12rem; line-height: 1.45; color: var(--ink); }

.view .who .av { width: 28px; height: 28px; font-size: .74rem; }
/* Donut */

@media (max-width: 520px) { .donutrow { grid-template-columns: minmax(0, 1fr); justify-items: center; } }
.legend2 { display: grid; gap: 6px; width: 100%; font-size: .84rem; }
.legend2 div { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.legend2 i { width: 10px; height: 10px; border-radius: 3px; }
/* Bell + notifications */
.bell { position: relative; }
.bell .dot { position: absolute; top: 4px; right: 6px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px; background: var(--red); color: #fff; font-size: .62rem; display: grid; place-items: center; font-weight: 600; }
.bell svg { width: 18px; height: 18px; }
.notes { position: absolute; right: 0; top: calc(100% + 8px); width: 320px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 8px; box-shadow: 0 20px 50px -20px rgba(0,0,0,.35); z-index: 30; display: grid; }
.notes .li { padding: 10px 8px; }
.notes h4 { margin: 4px 8px 6px; font-size: .86rem; }
/* Toggle */
.switch { appearance: none; width: 44px; height: 26px; border-radius: 999px; background: var(--line); position: relative; cursor: pointer; border: 0; flex: none; transition: background 200ms ease; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform 200ms ease; }
.switch[aria-checked="true"] { background: var(--green); }
.switch[aria-checked="true"]::after { transform: translateX(18px); }
/* Skeleton */
.skel { display: inline-block; height: 1em; width: 6ch; border-radius: 8px; background: linear-gradient(90deg, var(--hover), var(--line), var(--hover)); background-size: 200% 100%; animation: shimmer 1.2s infinite; vertical-align: middle; }
@keyframes shimmer { to { background-position: -200% 0; } }
/* Celebration */

.cele h2 { font-size: clamp(1.9rem, 6vw, 2.6rem); font-weight: 600; letter-spacing: -.04em; line-height: 1.08; }
.cele h2 em { font-family: "Newsreader", Georgia, serif; font-style: italic; font-weight: 400; color: #5fd49b; }
.cele p { color: var(--stage-sub); }
.cele .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; width: 100%; background: var(--stage-line); border-radius: 16px; overflow: hidden; }
.cele .stats div { background: var(--stage); padding: 12px 8px; display: grid; gap: 2px; }
.cele .stats span { font-size: .72rem; color: var(--stage-sub); } .cele .stats b { font-family: var(--m); font-weight: 500; }
.cele .seed { width: 84px; height: 84px; border-radius: 50% 50% 50% 10px; background: #12824f; transform: rotate(-45deg) scale(.2); animation: grow 900ms cubic-bezier(.2,1.4,.3,1) forwards; box-shadow: 0 0 60px rgba(95,212,155,.45); }
@keyframes grow { to { transform: rotate(-45deg) scale(1); } }
.leaf { position: absolute; width: 12px; height: 12px; border-radius: 50% 50% 50% 2px; opacity: 0; animation: burst 1600ms ease-out forwards; }
@keyframes burst { 0% { opacity: 0; transform: translate(0,0) rotate(0) scale(.4); } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(1); } }
.cele .btn.light { background: var(--stage-ink); color: var(--stage); }
@media (max-width: 900px) { .brand { align-content: start; } .brand p { font-size: .9rem; } }

.stack { display: flex; align-items: center; }

.ownrow { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.chipw { display: inline-flex; align-items: center; gap: 8px; font-size: .8rem; padding: 7px 11px; border-radius: 6px; background: rgba(255,255,255,.07); border: 1px solid var(--stage-line); color: var(--stage-ink); }

.ownhero .btns { display: flex; gap: 8px; flex-wrap: wrap; }
.ownhero .btn { background: #fff; color: var(--stage); }
.ownhero .btn.out { background: transparent; color: #fff; border: 1.5px solid rgba(255,255,255,.5); }
/* Holding rows with sparklines, clickable */
.li.hold4 { grid-template-columns: 36px minmax(0, 1fr) 76px auto; cursor: pointer; border-radius: 10px; transition: background 150ms ease; padding-inline: 6px; margin-inline: -6px; }
.li.hold4:hover { background: var(--hover); }
.spark { width: 76px; height: 26px; display: block; }
@media (max-width: 520px) { .li.hold4 { grid-template-columns: 36px minmax(0, 1fr) auto; } .li.hold4 .spark { display: none; } }
.own-units { font-size: .76rem; color: var(--sub); }
.own-units b { display: inline; color: var(--ink); font-weight: 600; font-family: var(--m); }
/* Proof sheet */
.proof { display: grid; gap: 14px; }
.proof .tokenhead { display: flex; gap: 14px; align-items: center; }
.proof .tokenhead .ic { width: 52px; height: 52px; font-size: .7rem; background: var(--navy); color: #fff; border: 0; }
.proof .bigunits { font-size: 2rem; font-weight: 600; letter-spacing: -.03em; font-family: var(--m); }
.cmp2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cmp2 > div { border-radius: 12px; padding: 12px; display: grid; gap: 6px; font-size: .84rem; align-content: start; }
.cmp2 .old { background: var(--hover); color: var(--sub); }
.cmp2 .new { background: var(--accent-soft, var(--green-soft)); color: var(--ink); border: 1px solid color-mix(in srgb, var(--accent, var(--green)) 30%, transparent); }
.cmp2 b { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; }
.verify { display: inline-flex; align-items: center; gap: 6px; font-size: .84rem; color: var(--accent, var(--green)); text-decoration: none; font-weight: 500; }
.verify:hover { text-decoration: underline; }
.range { width: 100%; accent-color: var(--accent, var(--green)); }
.seg2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
/* Entrance motion on tab change */
.content.enter > * { animation: up 420ms cubic-bezier(.2,.8,.2,1) both; }
.content.enter > *:nth-child(2) { animation-delay: 50ms; } .content.enter > *:nth-child(3) { animation-delay: 100ms; } .content.enter > *:nth-child(4) { animation-delay: 150ms; } .content.enter > *:nth-child(5) { animation-delay: 200ms; } .content.enter > *:nth-child(n+6) { animation-delay: 250ms; }
@keyframes up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
/* Brand-coloured company marks (monograms, not trademark images) */
.lg { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-family: var(--h, var(--f)); font-weight: 700; font-size: .8rem; flex: none; letter-spacing: -.02em; box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }
.lg.sm { width: 26px; height: 26px; font-size: .62rem; }

.lstack { display: flex; align-items: center; }
.lstack .lg { margin-left: -9px; box-shadow: 0 0 0 2px var(--card); }

.lstack .more { margin-left: 8px; font-size: .8rem; color: var(--sub); font-weight: 500; }
.ownhero .lstack .lg { box-shadow: 0 0 0 2px var(--stage); width: 40px; height: 40px; }
/* Live ticker tape (Glider-style) */

.tape-in { display: flex; gap: 10px; width: max-content; padding: 8px; animation: tape 48s linear infinite; }

@keyframes tape { to { transform: translateX(-50%); } }
.tk { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border-radius: 999px; background: var(--hover); font-size: .8rem; white-space: nowrap; }

/* Chart range tabs + axis (Coinbase / Glider) */

.yaxis { display: flex; flex-direction: column; justify-content: space-between; font-family: var(--m); font-size: .7rem; color: var(--faint); padding: 4px 0 26px; text-align: right; }
.retpill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 8px; border: 1px solid var(--line); font-size: .82rem; background: var(--card); }
.retpill b { font-family: var(--m); font-weight: 600; }
/* Strategy page (Glider layout) */

.shead h2 { font-size: clamp(1.6rem, 3.2vw, 2.2rem); font-weight: 700; letter-spacing: -.03em; }

.creator i { width: 22px; height: 22px; border-radius: 4px; background: var(--navy); color: #fff; display: grid; place-items: center; font-style: normal; font-size: .66rem; font-weight: 700; }
.comp { width: 100%; border-collapse: collapse; font-size: .88rem; }
.comp th { text-align: left; font-weight: 500; font-size: .74rem; color: var(--sub); padding: 0 8px 10px 0; border-bottom: 1px solid var(--line); }

.cohero::after { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.07) 1px, transparent 1px); background-size: 20px 20px; mask-image: linear-gradient(90deg, transparent 30%, #000); -webkit-mask-image: linear-gradient(90deg, transparent 30%, #000); }

.great { display: grid; gap: 12px; align-content: start; cursor: pointer; text-align: left; appearance: none; font: inherit; color: inherit; }

/* Plan / simulation */
.fan { width: 100%; height: 220px; display: block; }
.sliders { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 760px) { .sliders { grid-template-columns: minmax(0, 1fr); } }

.outcomes span { font-size: .74rem; color: var(--sub); } .outcomes b { font-size: 1.15rem; font-family: var(--m); }
.stress { display: grid; gap: 10px; }

.stress .sbar { height: 8px; border-radius: 8px; background: var(--hover); overflow: hidden; }

.lines { width: 100%; height: 200px; display: block; }
.lgnd { display: flex; flex-wrap: wrap; gap: 14px; font-size: .8rem; color: var(--sub); }
.lgnd span { display: inline-flex; align-items: center; gap: 6px; } .lgnd i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }

.team { display: flex; align-items: center; gap: 12px; }

.process div { padding: 12px; display: grid; gap: 4px; align-content: start; position: relative; background: var(--card); }
.process div + div { border-left: 1px solid var(--line); }
.process .n { font-family: var(--m); font-size: .7rem; color: var(--faint); }
.process b { font-size: .9rem; } .process span { font-size: .78rem; color: var(--sub); }

        S.custom = S.custom || {}; if (plain) delete S.custom[z.pid]; else S.custom[z.pid] = c;
        const parts = c.themes.map((k) => "+" + THEMES[k].name).concat(c.exclude.map((t) => "no " + NAMES[t])).concat(c.cash ? [c.cash + "% cash"] : []);
        log("update", plain ? "Back to the Schroders model for " + P(z.pid).short : "Personalised " + P(z.pid).short, plain ? "Tracking Schroders' weights" : parts.join(", ") + " · checked on Glider");
        T.pz = null; save(); render(); toast(plain ? "Following the Schroders model" : "Saved. Your next rebalance moves you to your new mix"); return; }
      case "planpid": T.planPid = d.pid; return render();
      case "cmp": { const i = T.cmp.indexOf(d.k); if (i >= 0) { if (T.cmp.length > 1) T.cmp.splice(i, 1); } else T.cmp.push(d.k); return render(); }
      case "autoall": Object.keys(S.holdings).forEach((pid) => { S.holdings[pid].auto = true; }); save(); render(); toast("Auto-invest on: $" + (T.plan ? T.plan.monthly : 200) + " a month"); return;
      case "bell": T.bell = !T.bell; T.menu = false; if (T.bell) { S.seenAt = Date.now(); save(); } return render();
      case "celedone": { const g = T.celebrate; T.celebrate = null; if (g && S.holdings[g]) { S.tab = "portfolios"; S.detail = g; T.dtab = "holdings"; save(); window.scrollTo(0, 0); } return render(); }
      case "auto": { const h = S.holdings[d.pid]; h.auto = !h.auto; save(); render(); toast(h.auto ? "Auto-invest on: $200 on the 1st of each month" : "Auto-invest off"); return; }
      case "ff": {
        if (Object.keys(S.holdings).some((pid) => unpriced(Object.keys(buy(pid, 1, price).units)).length)) return waitPrices();
        const t0 = T.px.MSFT && T.px.MSFT.closes; const days = t0 ? t0.length : 0;
        Object.keys(S.holdings).forEach((pid) => {
          const h = S.holdings[pid], r = buy(pid, h.amount, (t) => T.start[t] || price(t)); h.units = r.units;
          if (days) h.hist = t0.map((pt, i) => ({ t: pt.t, v: Object.keys(h.units).reduce((s, t) => s + h.units[t] * (t === "USDT" ? 1 : ((c) => (c && c.length ? (c[i] || c[c.length - 1]).c : price(t)))(T.px[t] && T.px[t].closes)), 0) }));
        });
        const when = t0 ? new Date(t0[0].t * 1000).toLocaleDateString(undefined, { day: "numeric", month: "short" }) : "last month";
        log("ff", "Fast-forward: invested on " + when, "Real closing prices since then"); save(); render(); toast("Showing a month of real market moves"); return; }
      case "publish": { const done = {}; Object.keys(S.holdings).forEach((gid) => { const pid = pidOf(gid); if (!isTheme(pid) && S.versions[pid] !== 2 && !done[pid]) { done[pid] = 1; S.versions[pid] = 2; log("update", "Schroders' team updated " + P(pid).short + ": " + P(pid).change, HISTORY[pid][1].w, { pid: gid, dec: true }); } }); save(); render(); toast("Schroders published a model update"); return; }
      case "xray": T.xray = !T.xray; try { localStorage.setItem("sprout-xray", T.xray ? "1" : "0"); } catch (er) {} T.menu = false; render(); toast(T.xray ? "X-ray on: showing what's under the hood" : "X-ray off"); return;
      case "resetmaya": try { localStorage.removeItem(KEY); localStorage.removeItem("sprout-admin-v1"); } catch (er) {} location.href = "/app?demo=1"; return;
      case "lifechange": S.profile.level = 2; S.profile.capped = true; log("update", "Risk profile updated: level 2", "You told us you may need some of this money sooner"); save(); render(); toast("Risk profile updated to level 2"); return;
      case "suitmove": { S.custom = S.custom || {}; const c = S.custom[d.pid] = S.custom[d.pid] || { risk: 3, themes: [], cash: 0, exclude: [] }, to = S.profile.level; c.risk = to; if (to < 3) c.themes = []; const clash = Object.keys(S.holdings).some((g) => g !== d.pid && S.custom[g] && skey(g, S.custom[g]) === skey(d.pid, c)); if (clash) c.priv = d.pid; log("update", gname(d.pid) + " moved to level " + to, "Suitability · moved in kind into " + (clash ? "its own private" : "the") + " level " + to + " strategy, nothing sold first", { pid: d.pid }); save(); render(); return rebalance(d.pid); }
      case "withdraw": T.own = null; T.wd = { pid: d.pid, mode: "kind", pct: 100, to: "", step: "form", fresh: true }; return render();
      case "wdmode": T.wd.mode = d.mode; T.wd.fresh = false; return render();
      case "wdself": T.wd.to = ethers.Wallet.createRandom().address; T.wd.fresh = false; return render();
      case "closewd": T.wd = null; return render();
      case "wdbg": T.wd = null; return render();
      case "wdsign": {
        const w = T.wd, p = P(w.pid), h = S.holdings[w.pid]; b.disabled = true; b.textContent = "Signing…";
        const msg = "SPROUT withdrawal\nOwner: " + S.auth.address + "\nPortfolio: " + p.name + "\nShare: " + w.pct + "%\nMode: " + (w.mode === "kind" ? "in kind to " + w.to : "sell to USDC") + "\nExpires: " + new Date(Date.now() + 600000).toISOString();
        await signMsg(msg);
        await wait(900);
        const st = position(w.pid), out = st.total * w.pct / 100;
        if (w.pct >= 100) { delete S.holdings[w.pid]; } else { Object.keys(h.units).forEach((t) => { h.units[t] *= (1 - w.pct / 100); }); h.amount *= (1 - w.pct / 100); delete h.hist; }
        log("withdraw", (w.mode === "kind" ? "Moved " : "Sold ") + w.pct + "% of " + p.short, w.mode === "kind" ? "Shares sent to " + short(w.to) : usd(out) + " USDC to your wallet");
        w.step = "done"; w.fresh = false; save(); return render(); }
      case "own": T.own = { pid: d.pid, t: d.t, fresh: true }; return render();
      case "proofall": T.own = { fresh: true }; return render();
      case "closeown": T.own = null; return render();
      case "ownbg": T.own = null; return render();
      case "pause": { const h = S.holdings[d.pid]; h.paused = !h.paused; save(); render(); toast("Autopilot " + (h.paused ? "paused" : "resumed") + " for " + P(d.pid).short); return; }
      case "retake": S.profile.answers = []; S.profile.risk = null; S.ob = "risk"; save(); return render();
      case "copy": try { await navigator.clipboard.writeText(S.auth.address); toast("Wallet address copied"); } catch (er) { toast(S.auth.address); } return;
      case "signout": try { localStorage.removeItem(KEY); } catch (er) {} S = blank(); wallet = null; T.menu = false; T.sheet = null; return render();
    }
  });

  // ---------- Render ----------
  function render() {
    applyOverrides();
    const inFlow = !S.auth || S.ob !== "done";
    if (S.auth && S.ob === "done" && !Object.keys(S.holdings).length) S.ob = S.profile.level ? "goal" : "risk";
    $("root").innerHTML = inFlow || !Object.keys(S.holdings).length ? `<div class="ob">${brandPanel()}<section class="flow">${obScreen()}</section></div>` : shell();
    setTimeout(() => { T.enter = false; }, 0);
    if (S.auth && S.ob === "done" && typeof pushNav === "function") { const h = S.detail ? "#goal/" + encodeURIComponent(S.detail) : "#" + S.tab; if (location.hash !== h) window.history.replaceState(null, "", location.pathname + location.search + h); }
    $("overlay").innerHTML = loginModal() + sheet() + ownSheet() + wdSheet() + decisionSheet() + rcptSheet() + celebration();
    wire();
  }
  const shown = {};
  function wire() {
    const gn = $("gname"); if (gn) gn.addEventListener("input", () => { draft().goal.name = gn.value.trim(); save(); const b = document.querySelector('[data-to="purpose"]'); if (b) b.disabled = !gn.value.trim(); });
    const gt = $("gtarget"); if (gt) gt.addEventListener("change", () => { draft().goal.target = parseInt(gt.value.replace(/[^0-9]/g, ""), 10) || null; save(); });
    document.querySelectorAll(".pzfine").forEach((x) => x.addEventListener("toggle", () => { T.fineOpen = x.open; }));
    document.querySelectorAll(".vfy").forEach((d) => d.addEventListener("toggle", () => { if (T.own) { T.own.vfy = d.open; T.own.fresh = false; } }));
    document.querySelectorAll(".chartwrap").forEach((wrap) => {
      const pts = JSON.parse(wrap.dataset.pts), svg = wrap.querySelector("svg");
      const line = document.createElement("div"), dot = document.createElement("div"), tip = document.createElement("div");
      line.className = "cline"; dot.className = "cdot"; tip.className = "ctip"; [line, dot, tip].forEach((n) => { n.hidden = true; wrap.appendChild(n); });
      const move = (ev) => {
        const r = svg.getBoundingClientRect(), fx = Math.min(Math.max((ev.clientX - r.left) / r.width, 0), 1);
        let best = 0; pts.forEach((p, i) => { if (Math.abs(p[0] - fx) < Math.abs(pts[best][0] - fx)) best = i; });
        const p = pts[best], px = p[0] * r.width, py = p[1] * r.height;
        line.style.left = px + "px"; dot.style.left = px + "px"; dot.style.top = py + "px";
        tip.style.left = Math.min(Math.max(px, 60), r.width - 60) + "px";
        tip.textContent = usd(p[2]) + " · " + (best === pts.length - 1 ? "Now" : new Date(p[3] * 1000).toLocaleDateString(undefined, { day: "numeric", month: "short" }));
        [line, dot, tip].forEach((n) => { n.hidden = false; });
      };
      wrap.addEventListener("pointermove", move); wrap.addEventListener("pointerdown", move);
      wrap.addEventListener("pointerleave", () => { [line, dot, tip].forEach((n) => { n.hidden = true; }); });
    });
    document.querySelectorAll("[data-count]").forEach((el, i) => {
      const to = +el.dataset.count, key = "c" + i, from = shown[key];
      shown[key] = to;
      if (!T.asOf || reduce || from === undefined || Math.abs(to - from) < 1) return;
      const t0 = performance.now(), dur = 900;
      const step = (now) => { const k = Math.min((now - t0) / dur, 1), e = 1 - Math.pow(1 - k, 3); el.textContent = usd(from + (to - from) * e); if (k < 1) requestAnimationFrame(step); };
      requestAnimationFrame(step);
    });
    const pe = $("pm-email"); if (pe) { pe.addEventListener("input", () => { T.email = pe.value.trim(); }); pe.addEventListener("keydown", (e) => { if (e.key === "Enter") document.querySelector('[data-act="pm-submit"]').click(); }); if (!T.email) pe.focus(); }
    for (let k = 0; k < 6; k++) { const c = $("c" + k); if (!c) break;
      c.addEventListener("input", () => { c.value = c.value.replace(/\D/g, "").slice(-1); T.code = Array.from({ length: 6 }, (_, j) => ($("c" + j).value || "")).join(""); if (c.value && k < 5) $("c" + (k + 1)).focus(); if (T.code.length === 6) finishLogin(); }); }
    const co = $("country"); if (co) co.addEventListener("change", () => { S.profile.country = co.value; S.profile.pro = false; save(); render(); });
    const pr = $("pro"); if (pr) pr.addEventListener("change", () => { S.profile.pro = pr.checked; save(); render(); });
    const ack = $("ack"); if (ack) ack.addEventListener("change", () => { T.sheet.ack = ack.checked; T.sheet.fresh = false; render(); });
    const wp = $("wdpct"); if (wp) wp.addEventListener("input", () => { T.wd.pct = +wp.value; T.wd.fresh = false; const lab = wp.previousElementSibling; if (lab) lab.innerHTML = 'How much: <b class="num">' + T.wd.pct + '%</b> · ' + usd(position(T.wd.pid).total * T.wd.pct / 100); });
    wp && wp.addEventListener("change", () => render());
    const wt = $("wdto"); if (wt) wt.addEventListener("input", () => { T.wd.to = wt.value.trim(); const btn = document.querySelector('[data-act="wdsign"]'); if (btn) btn.disabled = !/^0x[0-9a-fA-F]{40}$/.test(T.wd.to); });
    const ps = $("pzsleeve"); if (ps) { ps.addEventListener("input", () => { T.pz.c.sleeve = +ps.value; $("pzsl").textContent = ps.value + "%"; }); ps.addEventListener("change", () => { revalidatePz(); render(); }); }
    const ackRisk = $("ackrisk"); if (ackRisk) ackRisk.addEventListener("change", () => { draft().ack = ackRisk.checked; save(); render(); });
    const pc = $("pzcash"); if (pc) { pc.addEventListener("input", () => { T.pz.c.cash = +pc.value; $("pzcl").textContent = Math.max(+pc.value, schroModel(T.pz.pid).USDT || 0) + "%"; }); pc.addEventListener("change", () => { revalidatePz(); render(); }); }
    const pm = $("planm"); if (pm) { pm.addEventListener("input", () => { T.plan.monthly = +pm.value; $("plm").textContent = usd(+pm.value, 0); }); pm.addEventListener("change", () => render()); }
    const py = $("plany"); if (py) { py.addEventListener("input", () => { T.plan.years = +py.value; $("ply").textContent = py.value + " years"; }); py.addEventListener("change", () => render()); }
    const amt = $("amt"); if (amt) {
      // Keep cents ("1,000.50" is $1,000.50). Skip the re-render when focus is moving to a button: re-rendering mid-click would swallow it.
      amt.addEventListener("change", () => { T.sheet.amount = Math.max(0, Math.round((parseFloat(amt.value.replace(/[^0-9.]/g, "")) || 0) * 100) / 100); T.sheet.fresh = false; });
      amt.addEventListener("focusout", (e) => { if (amt.isConnected && T.sheet && !(e.relatedTarget && e.relatedTarget.closest("[data-act]"))) render(); });
      amt.addEventListener("keydown", (e) => { if (e.key === "Enter") amt.blur(); });
    }
  }
  document.addEventListener("keydown", (e) => { if ((e.key === "p" || e.key === "P") && !/INPUT|TEXTAREA|SELECT/.test((e.target.tagName || "")) && S.auth && S.ob === "done") { T.menu = !T.menu; T.bell = false; render(); return; } if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-act='own']")) { e.preventDefault(); e.target.click(); } if (e.key === "Escape") { T.dec = null; T.own = null; T.wd = null; T.sheet = null; T.pz = null; render(); } });
  function loadPrices() {
    return fetch("/api/prices?symbols=" + ALL.join(",")).then((r) => r.json()).then((j) => {
      let open = false;
      T.flash = {}; Object.values(j.prices).forEach((p) => { if (!p.price) return; const old = T.px[p.symbol]; if (old && old.price !== p.price) T.flash[p.symbol] = p.price > old.price ? 1 : -1; T.px[p.symbol] = p; open = open || p.marketOpen; if (p.closes && p.closes.length && !T.start[p.symbol]) T.start[p.symbol] = p.closes[0].c; });
      T.asOf = j.asOf; T.open = open;
      const typing = document.activeElement && /INPUT|SELECT/.test(document.activeElement.tagName);
      if (!typing && !T.modal && !Object.keys(T.runs).length && !(T.sheet && T.sheet.fundStep)) render();
      setTimeout(() => { T.flash = {}; }, 1400);
    }).catch(() => {});
  }
  // Presenter quick start: /app?demo=1 opens Maya, the same investor as the landing page, if no one is signed in.
  // She invested about a month ago at real closing prices; the backfill replays Glider's daily rebalancing ($5 threshold) on real closes since then.
  function backfill(pid, amount) {
    const w = modelOf(pid), syms = Object.keys(w).filter((t) => t !== "USDT"), n = Math.min(...syms.map((t) => T.px[t].closes.length));
    const ts = T.px[syms[0]].closes.slice(0, n).map((c) => c.t), at = (t, i) => (t === "USDT" ? 1 : T.px[t].closes[i].c);
    const fee0 = amount * 0.003 * (1 - (w.USDT || 0) / 100), net = amount - fee0, units = {}, events = [];
    Object.keys(w).forEach((t) => { units[t] = net * w[t] / 100 / at(t, 0); });
    const val = (i) => Object.keys(units).reduce((s, t) => s + units[t] * at(t, i), 0), hist = [{ t: ts[0], v: val(0) }];
    for (let i = 1; i < n; i++) {
      const v = val(i), all = Object.keys(w).map((t) => ({ t, d: v * w[t] / 100 - units[t] * at(t, i) }));
      const trades = all.some((x) => x.t !== "USDT" && Math.abs(x.d) >= 5) ? all.filter((x) => Math.abs(x.d) >= 5) : []; // same $5 rule as planTrades and the console
      if (trades.length) { trades.forEach((x) => { units[x.t] += x.d / at(x.t, i); }); const left = -trades.reduce((a, x) => a + x.d, 0); units.USDT = (units.USDT || 0) + left; /* proceeds not reinvested stay as cash */ const shown = trades.filter((x) => x.t !== "USDT"), fee = shown.filter((x) => x.d > 0).reduce((s, x) => s + x.d, 0) * 0.003; const k = (v - fee) / v; Object.keys(units).forEach((t) => { units[t] *= k; }); events.push({ at: ts[i] * 1000, trades: shown.sort((x, y) => x.d - y.d), fee }); }
      hist.push({ t: ts[i], v: val(i) });
    }
    return { units, hist, fee0, events, t0: ts[0] * 1000 };
  }
  async function quickStart() {
    if (S.auth || !/[?&]demo=1/.test(location.search)) return;
    const plan = [{ gid: "quality~ret", goal: { name: "Retirement", target: 60000, years: 20 }, c: { risk: 3, themes: ["ai"], cash: 0, exclude: [] }, amount: 1000 },
      { gid: "income~home", goal: { name: "Home deposit", target: 15000, years: 5 }, c: { risk: 2, themes: [], cash: 0, exclude: [] }, amount: 500 }];
    const need = Array.from(new Set(plan.flatMap((g) => Object.keys(personal(pidOf(g.gid), g.c))))).filter((t) => t !== "USDT");
    const ready = () => need.every((t) => price(t) && T.px[t].closes && T.px[t].closes.length > 3);
    for (let i = 0; i < 40 && !ready(); i++) await wait(250);
    if (!ready()) return;
    const wl = ethers.Wallet.createRandom(); wallet = wl;
    S = blank(); S.auth = { address: wl.address, pk: wl.privateKey, email: "maya@example.com" };
    S.profile = { country: "ID", pro: false, answers: [1, 1, 1, 1, 1], score: 10, risk: 2, level: 3, capped: false };
    const push = (at, kind, title, detail, extra) => S.feed.push(Object.assign({ kind, title, detail, at }, extra || {}));
    plan.forEach((g, gi) => {
      S.custom[g.gid] = g.c; S.versions[pidOf(g.gid)] = 1;
      const bf = backfill(g.gid, g.amount), t0 = bf.t0 - 3 * 3.6e6 + gi * 9e5;
      if (!gi) push(t0 - 9e5, "signin", "Account created", "Secured by your login");
      push(t0 - 3e5, "update", "Goal set up: " + g.goal.name, P(g.gid).short + " · level " + g.c.risk + (g.c.themes.length ? " + " + g.c.themes.map((k) => THEMES[k].name).join(", ") : "") + " · checked on Glider");
      push(t0 - 2e5, "approve", "Opted in to Schroders active management", g.goal.name + " · signed by your wallet");
      push(t0, "deposit", "Invested " + usd(g.amount) + " in " + g.goal.name, "Bought " + Object.keys(bf.units).length + " holdings · fee " + usd(bf.fee0));
      bf.events.forEach((e) => push(e.at, "rebalance", g.goal.name + " back on target", "Daily rebalance · " + e.trades.length + " trade" + (e.trades.length === 1 ? "" : "s") + ", fee " + usd(e.fee), { trades: e.trades, pid: g.gid, mode: "drift", fee: e.fee }));
      const last = bf.events[bf.events.length - 1];
      S.holdings[g.gid] = { amount: g.amount, units: bf.units, funded: t0, hist: bf.hist, appliedV: 1, goal: g.goal, lastRun: last ? last.trades.length + " trades · " + new Date(last.at).toLocaleDateString(undefined, { day: "numeric", month: "short" }) : null };
    });
    S.feed.sort((a, b) => a.at - b.at);
    S.ob = "done"; S.tab = "home"; S.seenAt = Date.now(); save(); window.history.replaceState(null, "", location.pathname); render();
  }
  window.addEventListener("storage", (e) => { if (e.key === KEY && e.newValue) { try { S = Object.assign(blank(), JSON.parse(e.newValue)); applyOverrides(); loadPrices(); render(); } catch (er) {} } });
  // Browser Back/Forward move between app screens, and each screen has its own address (#home, #portfolios, #goal/<id>...).
  const NAVTABS = ["home", "portfolios", "plan", "activity", "profile"];
  function pushNav() { const h = S.detail ? "#goal/" + encodeURIComponent(S.detail) : "#" + S.tab; if (location.hash !== h) window.history.pushState(null, "", location.pathname + h); }
  function fromHash() {
    const h = decodeURIComponent(location.hash.slice(1)); if (!h) return false;
    if (h.indexOf("goal/") === 0 && S.holdings[h.slice(5)]) { S.tab = "portfolios"; S.detail = h.slice(5); T.dtab = "holdings"; }
    else if (NAVTABS.includes(h)) { S.tab = h; S.detail = null; } else return false;
    T.dec = null; T.rcpt = null; T.own = null; T.sheet = null; T.menu = false; return true;
  }
  // An address we don't recognise (an old or mistyped goal link) lands on Home; render() then corrects the hash.
  window.addEventListener("popstate", () => { if (S.ob !== "done") return; if (!fromHash()) { S.tab = "home"; S.detail = null; } save(); window.scrollTo(0, 0); render(); });
  if (S.auth && S.ob === "done") { if (!fromHash()) window.history.replaceState(null, "", location.pathname + location.search + (S.detail ? "#goal/" + encodeURIComponent(S.detail) : "#" + (S.tab || "home"))); }
  // Arriving from the website with a strategy chosen: go straight to its plan (after sign-up and the five questions, if needed).
  (function () { const q = new URLSearchParams(location.search).get("strategy"); if (!q || !P(q)) return; if (P(q).theme && !THEMES_LIVE) { window.history.replaceState(null, "", location.pathname); return; } window.history.replaceState(null, "", location.pathname);
    if (S.auth && S.profile.level) startStrat(q); else try { sessionStorage.setItem("sprout-intent", q); } catch (er) {} })();
  render(); loadPrices().then(quickStart); setInterval(loadPrices, 10000);
})();
</script>
